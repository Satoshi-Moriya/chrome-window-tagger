<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1b1b1f;
        --muted: #6b6b76;
        --line: #e2e2e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f1f23;
          --fg: #ececf1;
          --muted: #9b9ba6;
          --line: #35353d;
        }
      }
      body {
        width: 272px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 system-ui, 'Yu Gothic UI', sans-serif;
      }
      label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 5px;
      }
      input[type='text'] {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      input[type='text']:focus {
        outline: 2px solid #1e88e5;
        outline-offset: 1px;
        border-color: transparent;
      }
      .swatches {
        display: flex;
        gap: 7px;
        margin: 12px 0;
      }
      .swatch {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        padding: 0;
      }
      .swatch[aria-pressed='true'] {
        border-color: var(--fg);
      }
      .swatch:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button.action {
        flex: 1;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: #1e88e5;
        border-color: #1e88e5;
        color: #fff;
        font-weight: 600;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
      }
      .caution {
        margin: 5px 0 0 22px;
        font-size: 11px;
        line-height: 1.45;
        color: var(--muted);
      }
      .note {
        margin: 12px 0 0;
        font-size: 11px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        padding-top: 9px;
      }
    </style>
  </head>
  <body>
    <label for="name">このウィンドウのタスク名</label>
    <input id="name" type="text" placeholder="例：請求書まわり" autofocus />

    <div class="swatches" id="swatches" role="group" aria-label="色"></div>

    <div class="check">
      <input id="title" type="checkbox" aria-describedby="title-caution" />
      <label for="title" style="margin: 0">タブのタイトルにも付ける</label>
    </div>
    <p class="caution" id="title-caution">
      タスクバーや Alt+Tab にも表示されます。ただしタスク名が
      閲覧中のページから読み取れる状態になり、Chrome
      の履歴にも残ります。社外秘の名前は入れないでください。
    </p>

    <div class="row">
      <button id="apply" class="action primary">適用</button>
      <button id="clear" class="action">解除</button>
    </div>

    <p class="note">タグは Chrome を終了すると消えます。</p>

    <script src="popup.js"></script>
  </body>
</html>
