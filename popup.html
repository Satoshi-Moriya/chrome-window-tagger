<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1b1b1f;
        --muted: #6b6b76;
        --line: #e2e2e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f1f23;
          --fg: #ececf1;
          --muted: #9b9ba6;
          --line: #35353d;
        }
      }
      body {
        width: 272px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 system-ui, 'Yu Gothic UI', sans-serif;
      }
      label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 5px;
      }
      input[type='text'] {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      input[type='text']:focus {
        outline: 2px solid #1e88e5;
        outline-offset: 1px;
        border-color: transparent;
      }
      .swatches {
        display: flex;
        gap: 7px;
        margin: 12px 0;
      }
      .swatch {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        padding: 0;
      }
      .swatch[aria-pressed='true'] {
        border-color: var(--fg);
      }
      .swatch:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }
      /* 画面の縮図として見せる。文字で「右下」と書くより、
         位置関係がそのまま伝わる。 */
      .corners {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        width: 92px;
        height: 58px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .corner {
        border: 0;
        border-radius: 3px;
        background: color-mix(in srgb, var(--fg) 10%, transparent);
        cursor: pointer;
        padding: 0;
        position: relative;
      }
      .corner::after {
        content: '';
        position: absolute;
        width: 14px;
        height: 5px;
        border-radius: 2px;
        background: color-mix(in srgb, var(--fg) 32%, transparent);
      }
      .corner[data-pos='top-left']::after {
        top: 3px;
        left: 3px;
      }
      .corner[data-pos='top-right']::after {
        top: 3px;
        right: 3px;
      }
      .corner[data-pos='bottom-left']::after {
        bottom: 3px;
        left: 3px;
      }
      .corner[data-pos='bottom-right']::after {
        bottom: 3px;
        right: 3px;
      }
      .corner[aria-pressed='true'] {
        background: color-mix(in srgb, #1e88e5 22%, transparent);
      }
      .corner[aria-pressed='true']::after {
        background: #1e88e5;
      }
      .corner:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 1px;
      }

      .sizes {
        display: flex;
        gap: 6px;
        margin-top: 5px;
      }
      .size-btn {
        flex: 1;
        padding: 6px 0;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .size-btn[aria-pressed='true'] {
        border-color: #1e88e5;
        color: #1e88e5;
        background: color-mix(in srgb, #1e88e5 12%, transparent);
        font-weight: 600;
      }
      .size-btn:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 1px;
      }

      .row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button.action {
        flex: 1;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: #1e88e5;
        border-color: #1e88e5;
        color: #fff;
        font-weight: 600;
      }
      .note {
        margin: 12px 0 0;
        font-size: 11px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        padding-top: 9px;
      }
    </style>
  </head>
  <body>
    <label for="name">このウィンドウのタスク名</label>
    <input id="name" type="text" placeholder="例：請求書まわり" autofocus />

    <div class="swatches" id="swatches" role="group" aria-label="色"></div>

    <label id="pos-label" style="margin-top: 14px">ラベルの表示位置</label>
    <div
      class="corners"
      id="corners"
      role="group"
      aria-labelledby="pos-label"
    ></div>

    <label id="size-label" style="margin-top: 14px">ラベルの大きさ</label>
    <div
      class="sizes"
      id="sizes"
      role="group"
      aria-labelledby="size-label"
    ></div>

    <div class="row">
      <button id="apply" class="action primary">適用</button>
      <button id="clear" class="action">解除</button>
    </div>

    <p class="note">タグは Chrome を終了すると消えます。</p>

    <script src="popup.js"></script>
  </body>
</html>
